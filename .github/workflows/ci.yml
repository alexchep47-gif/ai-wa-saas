name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-auth-secret-must-be-at-least-32-chars-long"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema (SQLite CI)
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: |
            .next/BUILD_ID
            .next/build-manifest.json
            package.json
          retention-days: 5

  security-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Audit production deps
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
